services:
  - type: web
    name: billionairesxchange-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    preDeployCommand: node scripts/migrate.js
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://billionairesxchange-e8162.web.app,https://billionairesxchange-e8162.firebaseapp.com
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: billionairesxchange-postgres
          property: connectionString
      - key: AUTH_PUBLIC_URL
        value: https://billionairesxchange-e8162.web.app
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

databases:
  - name: billionairesxchange-postgres
    databaseName: billionairesxchange
    region: oregon
    plan: 0.1c-256mb
    ipAllowList: []
